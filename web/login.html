<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · osintkit</title>
<style>
:root {
  --bg: #f6f6f3; --card: #ffffff; --ink: #1c1c1f; --muted: #75757d; --line: #e3e3de; --soft: #f0f0ec;
  --accent: #2a5bd7; --accent-ink: #ffffff; --err: #c93c3c;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121214; --card: #1b1b1e; --ink: #ececef; --muted: #8d8d96; --line: #2c2c31; --soft: #232327;
          --accent: #6f9bff; --accent-ink: #0d1530; --err: #ff7a7a; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
       display: grid; place-items: center; padding: 16px; }
main { width: 100%; max-width: 380px; }
h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -0.02em; text-align: center; }
h1 span { color: var(--accent); }
.sub { margin: 0 0 22px; color: var(--muted); text-align: center; font-size: 14px; }
form { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
input { width: 100%; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft);
        color: var(--ink); font-size: 16px; outline: none; margin-bottom: 16px; }
input:focus { border-color: var(--accent); background: var(--card); }
button { width: 100%; height: 46px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
         font: inherit; font-weight: 600; cursor: pointer; margin-top: 4px; }
button:disabled { opacity: .6; cursor: progress; }
.msg { border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 16px; }
.msg.err { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); }
.msg.ok { background: var(--soft); color: var(--muted); }
.foot { margin-top: 16px; text-align: center; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <h1>osint<span>kit</span></h1>
  <p class="sub">Private instance. Sign in to continue.</p>
  <form method="post" action="/login" id="f">
    <div id="msg" hidden></div>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" id="next" value="/">
    <button type="submit" id="go">Sign in</button>
  </form>
  <p class="foot">Repeated failed attempts are locked out for 15 minutes.</p>
</main>
<script>
const p = new URLSearchParams(location.search), msg = document.getElementById("msg");
const show = (cls, text) => { msg.hidden = false; msg.className = "msg " + cls; msg.textContent = text; };
if (p.get("error") === "locked") show("err", "Too many failed attempts. Try again in 15 minutes.");
else if (p.get("error")) show("err", "Wrong username or password.");
else if (p.get("out")) show("ok", "You've been signed out.");
const next = p.get("next");
if (next && next.startsWith("/") && !next.startsWith("//")) document.getElementById("next").value = next;
document.getElementById("f").addEventListener("submit", () => {
  const b = document.getElementById("go"); b.disabled = true; b.textContent = "Signing in…";
});
</script>
</body>
</html>
